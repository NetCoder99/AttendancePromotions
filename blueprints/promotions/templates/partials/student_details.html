<div id="div_student_details" class="row w-100" hx-swap-oob="true">
    <input type="hidden" id="hdnBadgeNumber" name="hdnBadgeNumber" value="{{badge_number}}">
    <h5 id="hdr_student_details" class="fw-bold mt-3 justify-start" style="width: 15rem;">Student Details:</h5>
    <div class="d-inline-block text-start ms-1" style="width: 12rem;">
        <label class="form-label ms-1 mb-0 fw-bold">Student Name:</label>
        <input id="inp_student_name" name="inp_student_name" type="text" class="form-control" value="{{student_name}}" readonly>
    </div>
    <div class="d-inline-block text-start ms-1" style="width: 12rem;">
        <label class="form-label ms-1 mb-0 fw-bold">Current Rank:</label>
        <input id="inp_student_rank" name="inp_student_rank" type="text" class="form-control" value="{{student_rank}}" readonly>
    </div>
    <div class="d-inline-block text-start ms-1" style="width: 12rem;">
        <label class="form-label ms-1 mb-0 fw-bold">Current Stripe:</label>
        <input id="inp_student_stripe" name="inp_student_rank" type="text" class="form-control" value="{{student_stripe}}" readonly>
    </div>
</div>
