<select name="studentBeltStripes"
        id="studentBeltStripes"
        class="form-select"
        hx-get="/upd_requirements_htmx"
        hx-trigger="change"
        hx-target="#div_requirements_counts"
        hx-swap-oob="true"
>
    {% for stripe_record in stripe_records %}
        <option value="{{ stripe_record.stripeId }}" {% if stripe_record.stripeId == next_stripe_id %}selected{% endif %}>{{ stripe_record.stripeName }}</option>
    {% endfor %}
</select>
