<select name="studentBeltNames"
        id="studentBeltNames"
        class="form-select"
        hx-get="/getStripes_htmx"
        hx-trigger="change"
        hx-target="#studentBeltStripes"
        hx-swap-oob="true"
>
    {% for belt_record in belts_records %}
        <option value="{{ belt_record.beltId }}" {% if belt_record.beltId == current_belt_id %}selected{% endif %}>{{ belt_record.beltTitle }}</option>
    {% endfor %}
</select>
